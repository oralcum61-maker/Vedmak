<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вкладка «Навыки»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Forum&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0c0e}
:root{--win:url(/_blob/87e703fea5923b81b14de143b47eb3a6);--plate:url(/_blob/054b0c3932311a5d7eef482af4046b30);--head:url(/_blob/0f260b069fb3883cd17efa2f1df5b34f);--btn:url(/_blob/b1eb324e641d3000965802b767379171);--go:url(/_blob/25a662b5f53f1112ff4004ab4aa96fd0);--gov:url(/_blob/56ea576c0be488a92a804d9cb5669820);--ok:url(/_blob/f447c3e0bd70eae8f56a4dda730e389e);--bad:url(/_blob/744d7204ef4cab34f4dab089284d66df);--rivet:radial-gradient(circle at 40% 35%,#f6f1e6 0,#aaa498 1.1px,#3c3b38 2.2px,#050607 2.8px,transparent 3.2px)}
button,input,select{font-family:'IBM Plex Sans',system-ui,sans-serif}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #e2ddd0;outline-offset:2px}
a{color:#d6d0c2;text-decoration:none}a:hover{color:#fff}
.root{background-color:#17181b;background-image:radial-gradient(130% 100% at 50% 0%,rgba(255,240,215,.04),transparent 50%,rgba(0,0,0,.35)),var(--win);background-size:100% 100%,512px 512px;color:#e2ddd0;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:12px;font-variant-numeric:tabular-nums}
.plate{position:relative;background-color:#1f2024;background-image:linear-gradient(180deg,rgba(255,245,225,.06),rgba(255,245,225,0) 35%,rgba(0,0,0,.24)),var(--plate);background-size:100% 100%,512px 512px;border:1px solid #060708;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,240,215,.1),inset 0 -1px 0 rgba(0,0,0,.55),0 2px 3px rgba(0,0,0,.55),0 14px 24px -14px rgba(0,0,0,.95)}
.well{background:#0c0d0f;border:1px solid #040405;border-radius:3px;box-shadow:inset 0 2px 6px rgba(0,0,0,.85),0 1px 0 rgba(255,240,215,.07)}
.ghead{display:flex;align-items:center;gap:9px;margin:0;font-weight:500;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#d6d0c2;text-shadow:0 1px 0 rgba(0,0,0,.9)}
.ghead::before{content:"";flex-shrink:0;width:6px;height:6px;transform:rotate(45deg);background:linear-gradient(135deg,#f2ece0,#77726a);box-shadow:0 0 0 1px #050607}
.ghead .rule{flex-grow:1;height:0;border-top:1px solid #050607;border-bottom:1px solid rgba(255,240,215,.07)}
.ghead .hint{font-size:10.5px;letter-spacing:.02em;text-transform:none;color:#a8a296;font-weight:400}
.cap{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#a8a296;text-shadow:0 1px 0 rgba(0,0,0,.9);white-space:nowrap}
.metal{background:linear-gradient(180deg,#fdf9ef 0%,#dcd6c8 44%,#9b958a 56%,#ebe6d9 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.switch{display:inline-flex;gap:2px;padding:3px;border-radius:4px}
.switch a{display:flex;align-items:center;gap:8px;height:34px;padding:0 16px;font-family:Forum,serif;font-size:15px;color:#bab4a8;border-radius:2px}
.switch a.on{color:#f3eee2;background-color:#2a2c31;background-image:linear-gradient(180deg,rgba(255,250,240,.14),rgba(0,0,0,.25)),var(--btn);background-size:100% 100%,512px 512px;box-shadow:inset 0 2px 0 #b8432c,inset 0 -1px 0 rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.7);text-shadow:0 1px 0 rgba(0,0,0,.9)}
.count{display:grid;place-items:center;min-width:22px;height:20px;padding:0 5px;box-sizing:border-box;font-family:'IBM Plex Sans',sans-serif;font-size:10.5px;font-weight:600;color:#f1ece0;background:#0a0b0c;border:1px solid #040405;border-radius:10px;box-shadow:inset 0 1px 2px rgba(0,0,0,.9)}
.frame{position:relative;flex-shrink:0;display:grid;place-items:center;background-color:#0b0c0e;border:1px solid #040405;border-radius:2px;box-shadow:inset 0 2px 8px rgba(0,0,0,.85),0 1px 0 rgba(255,240,215,.08);overflow:hidden}
.frame::after{content:"";position:absolute;inset:3px;border:1px solid rgba(226,221,208,.13);pointer-events:none}
.medal{position:relative;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 34% 26%,#fbf7ee 0,#cfc9bc 20%,#7f7a72 52%,#3a3935 80%,#1c1c1e 100%);box-shadow:0 0 0 1px #050607,0 5px 12px rgba(0,0,0,.85)}
.medal::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid rgba(255,255,255,.18);border-bottom-color:rgba(0,0,0,.35)}
.medal .face{position:absolute;border-radius:50%;display:grid;place-items:center;background:#0d0e10 radial-gradient(circle at 50% 30%,rgba(255,245,225,.09),transparent 62%);box-shadow:inset 0 3px 7px rgba(0,0,0,.95),inset 0 0 0 1px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.32)}
.medal .face b{font-family:Forum,serif;font-weight:400;line-height:1}
.medal.violet{background:radial-gradient(circle at 34% 26%,#ece6ff 0,#b3a6d9 22%,#6a5a98 54%,#2e2645 82%,#17121f 100%)}
.ring{position:absolute;inset:0}
.ring i{position:absolute;left:50%;top:1px;width:2px;margin-left:-1px;background:#121315;box-shadow:1px 0 0 rgba(255,255,255,.28)}
.ring i.on{background:#f2ecff;box-shadow:0 0 0 1px #17121f,0 0 6px rgba(220,205,255,.85)}
.go{position:relative;flex-shrink:0;height:40px;padding:0 26px;font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#fff6ef;background-color:#b8432c;background-image:var(--rivet),var(--rivet),linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 46%,rgba(0,0,0,.34)),var(--go);background-position:left 7px center,right 7px center,0 0,0 0;background-size:7px 7px,7px 7px,100% 100%,512px 512px;background-repeat:no-repeat,no-repeat,no-repeat,repeat;border:1px solid #2a0c06;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,215,195,.55),inset 0 -2px 0 rgba(0,0,0,.32),0 0 0 2px #303137,0 0 0 3px #060708,0 8px 14px -6px rgba(0,0,0,.95);text-shadow:0 -1px 0 rgba(60,10,0,.7)}
.go:hover{filter:brightness(1.1)}
.sbtn{height:34px;padding:0 14px;font-size:11px;font-weight:600;color:#f6f1e6;background-color:#3b3d43;background-image:linear-gradient(180deg,rgba(255,250,240,.2),rgba(255,250,240,0) 46%,rgba(0,0,0,.34)),var(--btn);background-size:100% 100%,512px 512px;border:1px solid #060708;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,250,240,.3),inset 0 -1px 0 rgba(0,0,0,.45),0 4px 8px -3px rgba(0,0,0,.95);text-shadow:0 1px 0 rgba(0,0,0,.95)}
.sbtn:hover{background-color:#484a51;color:#fff}
.sbtn b{font-family:Forum,serif;font-weight:400;font-size:15px;color:#b4c79c;margin-left:4px}
.stamp{flex-shrink:0;display:grid;place-items:center;font-family:Forum,serif;font-size:22px;background-color:#222328;background-image:repeating-linear-gradient(135deg,rgba(240,232,215,.075) 0 1px,transparent 1px 4px),linear-gradient(180deg,#2d2e33,#17181b);border:1px solid #050607;border-radius:2px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.3),inset 0 0 0 4px rgba(240,232,215,.12),inset 0 1px 0 rgba(255,245,225,.22),0 3px 7px rgba(0,0,0,.65)}

.sgrp{display:flex;flex-direction:column;padding:0 12px 10px;overflow:hidden}
.sgrp .stop{display:flex;align-items:center;gap:10px;margin:0 -12px 6px;padding:8px 12px 8px 14px;background-color:#131417;background-image:linear-gradient(180deg,rgba(255,245,225,.07),rgba(0,0,0,.25)),var(--head);background-size:100% 100%,512px 512px;border-bottom:1px solid #060708}
.sgrp .stop b{font-family:Forum,serif;font-weight:400;font-size:17px;letter-spacing:.06em;color:#f1ece0;text-shadow:0 1px 0 rgba(0,0,0,.9)}
.sk{display:flex;align-items:center;gap:8px;height:30px;border-bottom:1px solid rgba(0,0,0,.6);box-shadow:0 1px 0 rgba(255,240,215,.04)}
.sk:last-child{border-bottom:0;box-shadow:none}
.pm{flex-shrink:0;width:10px;height:10px;transform:rotate(45deg);border:1px solid #4a4c52;background:#0a0b0c}
.pm.on{border-color:#050607;background:linear-gradient(135deg,#ffd0c2,#b8432c);box-shadow:0 0 5px rgba(184,67,44,.6)}
.sname{flex-grow:1;min-width:0;padding:0;font-size:12.5px;text-align:left;color:#bab4a8;background:none;border:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk.tr .sname{color:#f6f1e6;font-weight:600}
.sname sup{margin-left:3px;font-size:10px;color:#e0937f}
.steps{display:flex;gap:2px;flex-shrink:0}
.steps i{width:4px;height:12px;border-radius:1px;background:#0a0b0c;box-shadow:inset 0 1px 1px rgba(0,0,0,.9),0 0 0 1px #050607}
.steps i.on{background:linear-gradient(180deg,#fdf9ef,#9b958a);box-shadow:0 0 0 1px #050607,0 0 4px rgba(255,250,235,.25)}
.lvl{width:30px;height:22px;padding:0;text-align:center;font-family:Forum,serif;font-size:14px;color:#e2ddd0;background:#0a0b0c;border:1px solid #040405;border-radius:2px;box-shadow:inset 0 1px 3px rgba(0,0,0,.9)}
.base{flex-shrink:0;width:34px;height:24px;padding:0;font-family:Forum,serif;font-size:16px;color:#8c867b;background:#141518;border:1px solid #060708;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,250,240,.06)}
.sk.tr .base{color:#fff6ef;background-color:#2a2c31;background-image:linear-gradient(180deg,rgba(255,250,240,.16),rgba(0,0,0,.3)),var(--btn);background-size:100% 100%,512px 512px;box-shadow:inset 0 1px 0 rgba(255,250,240,.25),0 2px 4px -1px rgba(0,0,0,.8)}
.toggle{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;font-size:11px;font-weight:600;color:#d6d0c2;background:#141518;border:1px solid #060708;border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,250,240,.08)}
.toggle .knob{position:relative;width:28px;height:14px;border-radius:7px;background:#0a0b0c;box-shadow:inset 0 1px 2px rgba(0,0,0,.95),0 0 0 1px #050607}
.toggle .knob::after{content:"";position:absolute;top:1px;left:1px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6f1e6,#77726a);transition:left .15s}
.toggle.on .knob{background:#4f3d22}
.toggle.on .knob::after{left:15px;background:radial-gradient(circle at 35% 30%,#ffd0c2,#b8432c)}
@media (prefers-reduced-motion: reduce){.toggle .knob::after{transition:none}}
</style>
</helmet>
<div class="root" style="width: 800px; min-height: 1080px; box-sizing: border-box; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
    <nav class="switch well" aria-label="Навыки и профессия"><a class="on" href="#">Навыки <span class="count">8</span></a><a href="#">Профессия <span class="count">0/0</span></a></nav>
    <span style="flex-grow: 1"></span>
    <span style="display: flex; align-items: center; gap: 10px; font-size: 11px; color: #bab4a8"><span class="pm on"></span>навык профессии<span style="margin-left: 8px; color: #e0937f">*</span>сложный</span>
    <button type="button" class="{{toggleCls}}" onClick="{{toggle}}" aria-pressed="{{trainedOnly}}"><span class="knob"></span>Только изученные</button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start">
    <sc-for list="{{cols}}" as="col" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <sc-for list="{{col.groups}}" as="g" hint-placeholder-count="3">
      <section class="plate sgrp">
        <div class="stop"><b>{{g.label}}</b><span style="flex-grow: 1; height: 0; border-top: 1px solid #050607; border-bottom: 1px solid rgba(255,240,215,.07)"></span><span class="medal" style="width: 38px; height: 38px"><span class="face" style="inset: 5px"><b class="metal" style="font-size: 17px">{{g.value}}</b></span></span></div>
        <sc-for list="{{g.rows}}" as="s" hint-placeholder-count="6">
        <div class="{{s.cls}}">
          <span class="{{s.pmCls}}" aria-label="{{s.pmLabel}}"></span>
          <button type="button" class="sname">{{s.label}}<sc-if value="{{s.difficult}}" hint-placeholder-val="{{false}}"><sup>*</sup></sc-if></button>
          <span class="steps" aria-hidden="true"><sc-for list="{{s.steps}}" as="st" hint-placeholder-count="10"><i class="{{st.cls}}"></i></sc-for></span>
          <input class="lvl" type="number" value="{{s.value}}" min="0" max="10" aria-label="Вложено: {{s.label}}">
          <button type="button" class="base" aria-label="Бросок: {{s.label}}">{{s.base}}</button>
        </div>
        </sc-for>
      </section>
      </sc-for>
    </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { trainedOnly: false }; }
  renderVals() {
    const data = [["Интеллект", 7, [["Внимание", 5, 12, 1, 0, 0], ["Выживание в дикой природе", 0, 7, 0, 0, 0], ["Дедукция", 0, 7, 0, 0, 0], ["Монстрология", 6, 13, 1, 0, 1], ["Образование", 0, 7, 0, 0, 0], ["Ориентирование в городе", 0, 7, 0, 0, 0], ["Передача знаний", 0, 7, 0, 0, 0], ["Тактика", 0, 7, 0, 0, 1], ["Торговля", 0, 7, 0, 0, 0], ["Этикет", 0, 7, 0, 0, 0], ["Язык: всеобщий", 0, 7, 0, 0, 1], ["Язык: Старшая Речь", 0, 7, 0, 0, 1], ["Язык: краснолюдский", 0, 7, 0, 0, 1]]], ["Реакция", 9, [["Ближний бой", 0, 9, 0, 0, 0], ["Борьба", 0, 9, 0, 0, 0], ["Верховая езда", 3, 12, 1, 0, 0], ["Владение древковым оружием", 0, 9, 0, 0, 0], ["Владение лёгкими клинками", 0, 9, 0, 0, 0], ["Владение мечом", 6, 15, 1, 1, 0], ["Мореходство", 0, 9, 0, 0, 0], ["Уклонение/Изворотливость", 5, 14, 1, 0, 0]]], ["Ловкость", 8, [["Атлетика", 0, 8, 0, 0, 0], ["Ловкость рук", 0, 8, 0, 0, 0], ["Скрытность", 0, 8, 0, 0, 0], ["Стрельба из арбалета", 0, 8, 0, 0, 0], ["Стрельба из лука", 0, 8, 0, 0, 0]]], ["Телосложение", 10, [["Сила", 0, 10, 0, 0, 0], ["Стойкость", 0, 10, 0, 0, 0]]], ["Эмпатия", 4, [["Азартные игры", 0, 4, 0, 0, 0], ["Внешний вид", 0, 4, 0, 0, 0], ["Выступление", 0, 4, 0, 0, 0], ["Искусство", 0, 4, 0, 0, 0], ["Лидерство", 0, 4, 0, 0, 0], ["Обман", 0, 4, 0, 0, 0], ["Понимание людей", 0, 4, 0, 0, 0], ["Соблазнение", 0, 4, 0, 0, 0], ["Убеждение", 0, 4, 0, 0, 0], ["Харизма", 0, 4, 0, 0, 0]]], ["Ремесло", 6, [["Алхимия", 0, 6, 0, 0, 1], ["Взлом замков", 0, 6, 0, 0, 0], ["Знание ловушек", 0, 6, 0, 0, 1], ["Изготовление", 0, 6, 0, 0, 1], ["Маскировка", 0, 6, 0, 0, 0], ["Первая помощь", 0, 6, 0, 0, 0], ["Подделывание", 0, 6, 0, 0, 0]]], ["Воля", 7, [["Запугивание", 0, 7, 0, 0, 0], ["Наведение порчи", 5, 12, 1, 0, 1], ["Проведение ритуалов", 5, 12, 1, 0, 1], ["Сопротивление магии", 0, 7, 0, 0, 1], ["Сопротивление убеждению", 0, 7, 0, 0, 0], ["Сотворение заклинаний", 6, 13, 1, 0, 1], ["Храбрость", 0, 7, 0, 0, 0]]]];
    const only = this.state.trainedOnly;
    const groups = data.map(([label, value, rows]) => ({
      label, value,
      rows: rows.filter(r => !only || r[3]).map(([l, v, b, tr, prof, diff]) => ({
        label: l, value: v, base: b, difficult: !!diff,
        cls: tr ? 'sk tr' : 'sk', pmCls: prof ? 'pm on' : 'pm', pmLabel: prof ? 'Навык профессии' : 'Не навык профессии',
        steps: Array.from({ length: 10 }, (_, k) => ({ cls: k < v ? 'on' : '' }))
      }))
    })).filter(g => g.rows.length);
    // Две колонки по весу, как на листе: группы не перемешиваются
    const w = groups.map(g => g.rows.length + 2);
    const total = w.reduce((a, b) => a + b, 0);
    let cut = groups.length, best = total, acc = 0;
    for (let k = 1; k < groups.length; k++) { acc += w[k - 1]; const m = Math.max(acc, total - acc); if (m < best) { best = m; cut = k; } }
    return {
      trainedOnly: only,
      toggleCls: only ? 'toggle on' : 'toggle',
      toggle: () => this.setState({ trainedOnly: !only }),
      cols: [{ groups: groups.slice(0, cut) }, { groups: groups.slice(cut) }]
    };
  }
}
</script>
</body>
