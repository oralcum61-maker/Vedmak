<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ремесло — усиления</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Forum&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090b}
:root{--tl:url(/_blob/2d8e2a98d1c58c4f7ae1631148a88143);--tp:url(/_blob/bde7f1abcaebb87ef7a80201f2daf18d)}
a{color:#e2ddd0}a:hover{color:#fffaf0}
button{font-family:'IBM Plex Sans',system-ui,sans-serif}
button:focus-visible,a:focus-visible{outline:2px solid #e2ddd0;outline-offset:2px}
.mat{background-color:#17181b;background-image:var(--tl),radial-gradient(130% 100% at 50% 0%,rgba(255,240,215,.04),transparent 50%,rgba(0,0,0,.35));background-size:512px 512px,100% 100%;background-blend-mode:overlay,normal}
.plate{background-color:#1f2024;background-image:var(--tp),linear-gradient(180deg,rgba(255,245,225,.06),rgba(255,245,225,0) 35%,rgba(0,0,0,.24));background-size:512px 512px,100% 100%;background-blend-mode:overlay,normal;border:1px solid #060708;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,240,215,.1),inset 0 -1px 0 rgba(0,0,0,.55),0 2px 3px rgba(0,0,0,.55),0 14px 24px -14px rgba(0,0,0,.95)}
.well{background-color:#0c0d0f;border:1px solid #040405;border-radius:2px;box-shadow:inset 0 2px 6px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.4),0 1px 0 rgba(255,240,215,.07)}
.frame{position:relative;flex-shrink:0;display:grid;place-items:center;background-color:#0b0c0e;background-image:radial-gradient(circle at 50% 42%,rgba(255,245,225,.09),transparent 66%);border:1px solid #040405;box-shadow:inset 0 2px 8px rgba(0,0,0,.85),0 1px 0 rgba(255,240,215,.08)}
.frame::after{content:"";position:absolute;inset:4px;border:1px solid rgba(226,221,208,.13);pointer-events:none}
.btn{color:#e2ddd0;background-color:#25262b;background-image:linear-gradient(180deg,rgba(255,245,225,.1),rgba(0,0,0,.28));border:1px solid #060708;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,245,225,.13),inset 0 -1px 0 rgba(0,0,0,.4),0 3px 8px -3px rgba(0,0,0,.85);text-shadow:0 1px 0 rgba(0,0,0,.8)}
.ibtn{width:30px;height:30px;padding:0;display:grid;place-items:center;color:#a29d92}
.enamel{color:#f2edff;background-color:#6a5a98;background-image:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 46%,rgba(0,0,0,.32));border:1px solid #17102a;border-radius:2px;box-shadow:inset 0 1px 0 rgba(230,220,255,.4),inset 0 -2px 0 rgba(0,0,0,.3),0 5px 12px -4px rgba(0,0,0,.9);text-shadow:0 -1px 0 rgba(20,10,40,.6)}
.enamel:hover{filter:brightness(1.1)}
.engr{color:#d6d0c2;text-shadow:0 1px 0 rgba(0,0,0,.95),0 -1px 0 rgba(255,245,225,.06)}
.groove{height:0;border-top:1px solid #050607;border-bottom:1px solid rgba(255,240,215,.07)}
.gem{width:6px;height:6px;flex-shrink:0;transform:rotate(45deg);background:linear-gradient(135deg,#f2ece0,#77726a);box-shadow:0 0 0 1px #050607,0 1px 2px rgba(0,0,0,.8)}
.cap{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8e897e;text-shadow:0 1px 0 rgba(0,0,0,.9);white-space:nowrap}
.sw{display:flex;align-items:center;gap:8px;height:34px;padding:0 13px;font-family:Forum,serif;font-size:16px;color:#8e897e;text-decoration:none;border:1px solid transparent;border-radius:2px;text-shadow:0 1px 0 rgba(0,0,0,.9)}
.sw b{min-width:20px;height:18px;padding:0 5px;box-sizing:border-box;display:grid;place-items:center;font-family:Forum,serif;font-weight:400;font-size:13px;color:#a29d92;background:#08090a;border:1px solid #040405;border-radius:9px;box-shadow:inset 0 1px 2px rgba(0,0,0,.9)}
.sw-on{color:#f3eee2;background-color:#2a2c31;background-image:linear-gradient(180deg,rgba(255,245,225,.1),rgba(0,0,0,.22));border-color:#060708;box-shadow:inset 0 1px 0 rgba(255,245,225,.13),0 3px 8px -3px rgba(0,0,0,.85)}
.qty{position:absolute;right:-6px;bottom:-6px;min-width:22px;height:20px;padding:0 5px;box-sizing:border-box;display:grid;place-items:center;font-family:Forum,serif;font-size:14px;color:#f1ece0;background:#25262b linear-gradient(180deg,rgba(255,245,225,.1),rgba(0,0,0,.3));border:1px solid #060708;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.8)}
.kind{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;font-size:11px;border-radius:2px;color:#ece4ff;background:#4c4170 linear-gradient(180deg,rgba(255,255,255,.16),rgba(0,0,0,.25));border:1px solid #17102a;white-space:nowrap}
.slot{width:9px;height:9px;transform:rotate(45deg);box-shadow:0 0 0 1px #050607}
</style>
</helmet>
<div class="mat" style="width: 820px; height: 640px; box-sizing: border-box; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; color: #e2ddd0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px">
  <div style="display: flex; align-items: center; gap: 10px">
    <nav class="well" style="display: inline-flex; gap: 3px; padding: 3px" aria-label="Разделы ремесла">
      <a href="#" class="sw">Алхимия <b>8</b></a>
      <a href="#" class="sw">Чертежи и формулы <b>4</b></a>
      <a href="#" class="sw">Компоненты <b>15</b></a>
      <a href="#" class="sw sw-on">Усиления <b>4</b></a>
    </nav>
    <span style="flex-grow: 1"></span>
    <button type="button" class="btn" style="height: 30px; padding: 0 12px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase">+ Добавить</button>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <section class="plate" style="padding: 10px 14px 4px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 2px">
        <span class="gem"></span>
        <h3 class="engr" style="margin: 0; font-family: Forum, serif; font-weight: 400; font-size: 13px; letter-spacing: .24em; text-transform: uppercase">{{g.label}}</h3>
        <div class="groove" style="flex-grow: 1"></div>
        <span style="font-size: 11.5px; color: #6c685f">{{g.note}}</span>
      </div>
      <sc-for list="{{g.items}}" as="e" hint-placeholder-count="2">
        <div style="display: flex; gap: 14px; padding: 12px 0; border-bottom: {{e.edge}}; box-shadow: {{e.shine}}">
          <div class="frame" style="width: 68px; height: 68px"><img src="{{e.img}}" alt="" style="width: 56px; height: 56px; object-fit: contain"><span class="qty">{{e.q}}</span></div>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; align-items: center; gap: 8px">
              <a href="#" style="font-family: Forum, serif; font-size: 18px; color: #f1ece0; text-decoration: none; text-shadow: 0 1px 0 rgba(0,0,0,.9)">{{e.name}}</a>
              <span class="kind">{{e.kind}}</span>
              <span style="flex-grow: 1"></span>
              <button type="button" class="enamel" style="height: 30px; padding: 0 14px; font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase">{{e.go}}</button>
              <button type="button" class="btn ibtn" aria-label="Удалить" title="Удалить"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4h4v2M5.5 6l.8 10h7.4l.8-10"/></svg></button>
            </div>
            <span style="font-size: 12px; line-height: 1.4; color: #a29d92">{{e.effect}}</span>
            <div class="well" style="display: flex; align-items: center; gap: 14px; padding: 6px 10px">
              <span class="cap">Куда</span>
              <sc-for list="{{e.targets}}" as="t" hint-placeholder-count="2">
                <span title="{{t.title}}" style="display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: {{t.color}}">{{t.name}}
                  <span style="display: inline-flex; gap: 5px">
                    <sc-for list="{{t.slots}}" as="s" hint-placeholder-count="2"><span class="slot" style="background: {{s.bg}}"></span></sc-for>
                  </span>
                </span>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-for>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    // Ячейки предмета: занятая — руна или глиф (фиолет), свободная — серебро, недоступно — тусклая
    const slots = (used, total) => Array.from({ length: total }, (_, i) => ({ bg: i < used ? 'linear-gradient(135deg, #d6ccf3, #4c4170)' : 'linear-gradient(135deg, #f6f2ea, #8e897e)' }));
    const target = (name, used, total) => ({ name, slots: slots(used, total), color: used < total ? '#e2ddd0' : '#55585f',
      title: used < total ? `${name}: свободно ${total - used} из ${total}` : `${name}: ячеек нет` });
    const edge = (items) => items.map((r, i) => ({ ...r, edge: i === items.length - 1 ? '0' : '1px solid rgba(0,0,0,.6)', shine: i === items.length - 1 ? 'none' : '0 1px 0 rgba(255,240,215,.045)' }));
    const weapons = [target('Стальной меч Волка', 1, 2), target('Серебряный меч Волка', 1, 1)];
    const armors = [target('Куртка школы Волка', 0, 2)];
    const groups = [
      { label: 'Руны', note: 'на оружие · занимают ячейку', items: edge([
        { img: '/_blob/f0e745c2c8c930844b500a0bff60813a', name: 'Руна «Чернобог»', kind: 'Руна · оружие', q: '×1', go: 'Нанести', targets: weapons,
          effect: 'Когда оружие должно получить урон, бросьте 1d6: на 4, 5 или 6 оно не получает урона.' },
        { img: '/_blob/cd44bd18a7799fe1db25f1c6a348a659', name: 'Руна «Перун»', kind: 'Руна · оружие', q: '×1', go: 'Нанести', targets: weapons,
          effect: 'Каждый раз, когда вы получаете кость адреналина, добавьте к ней ещё одну.' }
      ]) },
      { label: 'Глифы', note: 'на броню · занимают ячейку', items: edge([
        { img: '/_blob/a69b30fa0333c88b095ee82e9ec9f480', name: 'Глиф огня', kind: 'Глиф · броня', q: '×2', go: 'Нанести', targets: armors,
          effect: 'В этой броне СЛ ваших заклинаний огня +3 или их урон +1d6.' },
        { img: '/_blob/987a6a17d93344a891065cc347cf7923', name: 'Глиф земли', kind: 'Глиф · броня', q: '×1', go: 'Нанести', targets: armors,
          effect: 'В этой броне СЛ ваших заклинаний земли +3 или их урон +1d6.' }
      ]) }
    ];
    return { groups };
  }
}
</script>
</body>
</html>
