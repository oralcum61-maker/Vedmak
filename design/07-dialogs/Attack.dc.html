<html lang="ru">
<head>
<meta charset="utf-8">
<title>Окно атаки</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Forum&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08090b}
:root{--tl:url(/_blob/25612d673b3b274e866a8cf86c3d2833);--tp:url(/_blob/0fd0aebb9a4144aaf6db521a13c98d51);--ts:url(/_blob/156614f725e3402f6b23739d306af141);--tb:url(/_blob/da2f0eb7e517d3ac1b3d1bda263bcf1e)}
button,input{font-family:'IBM Plex Sans',system-ui,sans-serif}
button{cursor:pointer}
button:focus-visible{outline:2px solid #e2ddd0;outline-offset:2px}
.mat{background-color:#17181b;background-image:var(--tl),radial-gradient(130% 100% at 50% 0%,rgba(255,240,215,.04),transparent 50%,rgba(0,0,0,.35));background-size:512px 512px,100% 100%;background-blend-mode:overlay,normal}
.rail{background-color:#121316;background-image:var(--tb),radial-gradient(140% 60% at 50% 0%,rgba(255,240,215,.06),transparent 60%);background-size:512px 512px,100% 100%;background-blend-mode:overlay,normal}
.plate{background-color:#1f2024;background-image:var(--tp),linear-gradient(180deg,rgba(255,245,225,.06),rgba(255,245,225,0) 35%,rgba(0,0,0,.24));background-size:512px 512px,100% 100%;background-blend-mode:overlay,normal;border:1px solid #060708;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,240,215,.1),inset 0 -1px 0 rgba(0,0,0,.55),0 2px 3px rgba(0,0,0,.55)}
.well{background-color:#0c0d0f;border:1px solid #040405;border-radius:2px;box-shadow:inset 0 2px 6px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.4),0 1px 0 rgba(255,240,215,.07)}
.btn{color:#e2ddd0;background-color:#25262b;background-image:linear-gradient(180deg,rgba(255,245,225,.1),rgba(0,0,0,.28));border:1px solid #060708;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,245,225,.13),inset 0 -1px 0 rgba(0,0,0,.4),0 3px 8px -3px rgba(0,0,0,.85);text-shadow:0 1px 0 rgba(0,0,0,.8)}
.btn:hover{background-color:#2d2f34;color:#f1ece0}
.enamel{color:#fff3ea;background-color:#b8432c;background-image:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 46%,rgba(0,0,0,.32));border:1px solid #2a0c06;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,215,195,.45),inset 0 -2px 0 rgba(0,0,0,.3),0 5px 12px -4px rgba(0,0,0,.9);text-shadow:0 -1px 0 rgba(60,10,0,.6)}
.enamel:hover{filter:brightness(1.1)}
.metal{background:linear-gradient(180deg,#fdf9ef 0%,#dcd6c8 44%,#9b958a 56%,#ebe6d9 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.95))}
.groove{height:0;border-top:1px solid #050607;border-bottom:1px solid rgba(255,240,215,.07)}
.gem{width:6px;height:6px;flex-shrink:0;transform:rotate(45deg);background:linear-gradient(135deg,#f2ece0,#77726a);box-shadow:0 0 0 1px #050607,0 1px 2px rgba(0,0,0,.8)}
.cap{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8e897e;text-shadow:0 1px 0 rgba(0,0,0,.9);white-space:nowrap}
.stamp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background-color:#222328;background-image:repeating-linear-gradient(135deg,rgba(240,232,215,.075) 0 1px,transparent 1px 4px),var(--ts),radial-gradient(circle at 32% 22%,rgba(255,245,225,.14),transparent 62%),linear-gradient(180deg,#2d2e33,#17181b);background-size:auto,256px 256px,auto,auto;background-blend-mode:normal,overlay,normal,normal;border:1px solid #050607;box-shadow:inset 0 0 0 3px rgba(0,0,0,.3),inset 0 0 0 4px rgba(240,232,215,.12),inset 0 1px 0 rgba(255,245,225,.22),0 3px 7px rgba(0,0,0,.65)}
.frame{position:relative;flex-shrink:0;display:grid;place-items:center;background-color:#0b0c0e;background-image:radial-gradient(circle at 50% 42%,rgba(255,245,225,.09),transparent 66%);border:1px solid #040405;box-shadow:inset 0 2px 8px rgba(0,0,0,.85),0 1px 0 rgba(255,240,215,.08)}
.frame::after{content:"";position:absolute;inset:4px;border:1px solid rgba(226,221,208,.13);pointer-events:none}
.head-h{display:flex;align-items:center;gap:10px}
.lbl{color:#d6d0c2;letter-spacing:.22em}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:58px;padding:8px 9px;text-align:left;color:#a29d92;background:#141518;border:1px solid #060708;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,240,215,.04)}
.opt:hover{color:#e2ddd0}
.opt b{font-family:Forum,serif;font-weight:400;font-size:15.5px;line-height:1.05;color:#d6d0c2}
.opt small{font-size:10.5px;line-height:1.3}
.opt.on{color:#e2ddd0;background-color:#2a2c31;background-image:linear-gradient(180deg,rgba(255,245,225,.1),rgba(0,0,0,.22));box-shadow:inset 0 2px 0 #b8432c,inset 0 1px 0 rgba(255,245,225,.13),0 4px 10px -4px rgba(0,0,0,.9)}
.opt.on b{color:#f3eee2}
.loc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;color:#8e897e;background:transparent;border:1px solid transparent;border-radius:2px}
.loc:hover{background:rgba(255,245,225,.035)}
.loc span{font-size:10px;line-height:1.15;text-align:center}
.loc b{font-family:Forum,serif;font-weight:400;font-size:15px;line-height:1;color:#e0937f}
.loc b.zero{color:#8e897e}
.loc.on{color:#f1ece0;background-color:#2a2c31;background-image:linear-gradient(180deg,rgba(255,245,225,.09),rgba(0,0,0,.2));border-color:#060708;box-shadow:inset 0 2px 0 #b8432c,0 6px 14px -6px rgba(0,0,0,.9)}
.part .shell{stroke:#050607;stroke-width:1.3;stroke-linejoin:miter}
.part .ink{fill:none;stroke:#050607;stroke-width:.9}
.part .slit{fill:#050607}
.part .hi{fill:none;stroke:rgba(255,255,255,.45);stroke-width:.8}
.part .rv{fill:#f1ece0}
.tog{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;font-size:11.5px;color:#a29d92;background:#141518;border:1px solid #060708;border-radius:2px}
.tog:hover{color:#e2ddd0}
.tog .box{width:11px;height:11px;flex-shrink:0;background:#0a0b0c;border:1px solid #3a3c42;box-shadow:inset 0 1px 2px rgba(0,0,0,.9)}
.tog b{font-family:Forum,serif;font-weight:400;font-size:14.5px}
.tog .bad{color:#e0937f}.tog .good{color:#b4c79c}
.tog.on{color:#f1ece0;background-color:#2a2c31;background-image:linear-gradient(180deg,rgba(255,245,225,.1),rgba(0,0,0,.22));box-shadow:inset 0 1px 0 rgba(255,245,225,.13),0 3px 8px -3px rgba(0,0,0,.85)}
.tog.on .box{background:linear-gradient(135deg,#f2ece0,#77726a);border-color:#050607}
.fold{width:100%;display:flex;align-items:center;gap:10px;padding:0;text-align:left;background:transparent;border:0;color:#d6d0c2}
.chev{width:10px;height:10px;flex-shrink:0;color:#8e897e}
.step{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:18px;line-height:1}
.sw{height:30px;padding:0 13px;font-family:Forum,serif;font-size:15px;color:#8e897e;background:transparent;border:1px solid transparent;border-radius:2px}
.sw.on{color:#f3eee2;background:#2a2c31;border-color:#060708;box-shadow:inset 0 1px 0 rgba(255,245,225,.12)}
.coin{width:22px;height:22px;padding:0;border-radius:50%;background:#16140f;border:1px solid #050607;box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 1px 0 rgba(255,240,215,.06)}
.coin.on{background:radial-gradient(circle at 35% 30%,#fbe7b0,#c9a052 55%,#6e5121);box-shadow:0 0 0 1px #2a1d08,0 2px 4px rgba(0,0,0,.7),0 0 8px rgba(224,180,90,.35)}
.coin.zero{display:grid;place-items:center;font-size:13px;color:#6c685f;background:transparent;border-color:transparent;box-shadow:none}
.coin.zero.on{color:#f1ece0;background:#2a2c31;border-color:#060708;box-shadow:inset 0 1px 0 rgba(255,245,225,.12)}
.costplate{width:100%;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;text-align:left;color:#a29d92;background:#141518;border:1px solid #060708;border-radius:2px}
.costplate.on{color:#f1ece0;background:#2a2c31;box-shadow:inset 0 1px 0 rgba(255,245,225,.13)}
.costplate .box{width:11px;height:11px;flex-shrink:0;background:#0a0b0c;border:1px solid #3a3c42}
.costplate.on .box{background:linear-gradient(135deg,#f2ece0,#77726a);border-color:#050607}
</style>
</helmet>
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <defs>
    <linearGradient id="m-ok" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f2ea"></stop><stop offset=".45" stop-color="#b3ada2"></stop><stop offset=".7" stop-color="#74706a"></stop><stop offset="1" stop-color="#3e3d3a"></stop></linearGradient>
    <linearGradient id="m-dim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8e897e"></stop><stop offset=".5" stop-color="#5a5752"></stop><stop offset="1" stop-color="#2c2b29"></stop></linearGradient>
    <linearGradient id="m-hot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f08a72"></stop><stop offset=".45" stop-color="#c4452f"></stop><stop offset=".7" stop-color="#7a2414"></stop><stop offset="1" stop-color="#3a120a"></stop></linearGradient>
  </defs>
</svg>
<div class="mat" style="width: 480px; min-height: 960px; box-sizing: border-box; display: flex; flex-direction: column; color: #e2ddd0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; font-variant-numeric: tabular-nums; border: 1px solid #040405; box-shadow: 0 24px 60px rgba(0,0,0,.8)">
  <header class="rail" style="height: 34px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px; border-bottom: 1px solid #060708; box-shadow: inset 0 1px 0 rgba(255,240,215,.08)">
    <span style="flex-grow: 1; font-family: Forum, serif; font-size: 15px; color: #d6d0c2; text-shadow: 0 1px 0 rgba(0,0,0,.95)">Атака: Серебряный меч школы Волка</span>
    <button type="button" aria-label="Закрыть" style="width: 28px; height: 28px; padding: 0; display: grid; place-items: center; color: #8e897e; background: transparent; border: 0"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
  </header>

  <section class="plate" style="margin: 14px 14px 0; padding: 12px 14px 12px 12px; display: flex; align-items: center; gap: 13px; box-shadow: inset 0 2px 0 #b8432c, inset 0 3px 0 rgba(0,0,0,.4), inset 0 -1px 0 rgba(0,0,0,.55), 0 2px 3px rgba(0,0,0,.55)">
    <div class="frame" style="width: 64px; height: 64px"><img src="/_blob/72f43b8b013119963123dd04111aecb4" alt="" style="width: 54px; height: 54px; object-fit: contain"></div>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
      <h1 style="margin: 0; font-family: Forum, serif; font-weight: 400; font-size: 22px; line-height: 1.05; color: #f1ece0; text-shadow: 0 1px 0 rgba(0,0,0,.95)">Серебряный меч школы Волка</h1>
      <span style="font-size: 11.5px; color: #8e897e">Лвк <b style="font-family: Forum, serif; font-weight: 400; font-size: 14px; color: #d6d0c2">10</b> · Владение мечом <b style="font-family: Forum, serif; font-weight: 400; font-size: 14px; color: #d6d0c2">6</b> · точность <b style="font-family: Forum, serif; font-weight: 400; font-size: 14px; color: #b4c79c">+1</b></span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #a29d92"><img src="/_blob/20afe6c06d54b4db8890436f71098284" alt="" style="width: 18px; height: 18px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px #050607"><span>цель — Утопец · 2 м</span></span>
    </div>
    <div class="stamp" style="width: 70px; height: 66px; flex-shrink: 0">
      <span class="cap" style="font-size: 8px; color: #a29d92">основа</span>
      <span class="metal" style="font-family: Forum, serif; font-size: 32px; line-height: 1">{{base}}</span>
    </div>
  </section>

  <div style="flex-grow: 1; padding: 16px 14px 18px; display: flex; flex-direction: column; gap: 17px">
    <div style="display: flex; flex-direction: column; gap: 9px">
      <div class="head-h"><span class="gem"></span><span class="cap lbl">Удар</span><div class="groove" style="flex-grow: 1"></div></div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="8">
          <button type="button" class="{{t.cls}}" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}"><b>{{t.label}}</b><small>{{t.note}}</small></button>
        </sc-for>
      </div>
      <span style="font-size: 11px; color: #8e897e">{{typeHint}}</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px">
      <div class="head-h"><span class="gem"></span><span class="cap lbl">Куда</span><div class="groove" style="flex-grow: 1"></div><span style="font-size: 11px; color: #6c685f">{{aimNote}}</span></div>
      <div class="well" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; padding: 3px">
        <sc-for list="{{locs}}" as="l" hint-placeholder-count="7">
          <button type="button" class="{{l.cls}}" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}">
            <svg class="part" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><g transform="{{l.flip}}"><path class="shell" fill="{{l.fill}}" d="{{l.shell}}"></path><path class="shell" fill="{{l.fill}}" d="{{l.shell2}}"></path><path class="ink" d="{{l.ink}}"></path><path class="slit" d="{{l.slit}}"></path><path class="hi" d="{{l.hi}}"></path></g></svg>
            <span>{{l.label}}</span>
            <b class="{{l.penCls}}">{{l.pen}}</b>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px">
      <button type="button" class="fold" aria-expanded="{{sitOpenAttr}}" onClick="{{toggleSit}}">
        <svg class="chev" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" style="transform: {{sitChev}}"><path d="M2 3.5l3 3 3-3"/></svg>
        <span class="cap lbl">Обстоятельства</span><div class="groove" style="flex-grow: 1"></div><span style="font-size: 11px; color: #b4c79c">{{sitNote}}</span>
      </button>
      <sc-if value="{{sitOpen}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-wrap: wrap; gap: 5px">
          <sc-for list="{{sits}}" as="s" hint-placeholder-count="6">
            <button type="button" class="{{s.cls}}" aria-pressed="{{s.pressed}}" onClick="{{s.toggle}}"><span class="box"></span><span>{{s.label}}</span><b class="{{s.valCls}}">{{s.val}}</b></button>
          </sc-for>
        </div>
      </sc-if>
      <button type="button" class="fold" aria-expanded="false">
        <svg class="chev" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" style="transform: rotate(-90deg)"><path d="M2 3.5l3 3 3-3"/></svg>
        <span class="cap lbl">Верхом: разбег или таран</span><div class="groove" style="flex-grow: 1"></div>
      </button>
    </div>

    <button type="button" class="{{extraCls}}" aria-pressed="{{extraPressed}}" onClick="{{toggleExtra}}">
      <span class="box"></span><span style="flex-grow: 1; font-size: 12.5px">Дополнительное действие атаки</span>
      <span style="font-family: Forum, serif; font-size: 15px; color: #e0937f">3 Вын · −3</span>
    </button>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 9px">
        <div class="head-h"><span class="gem"></span><span class="cap lbl">Модификаторы</span><div class="groove" style="flex-grow: 1"></div></div>
        <div style="display: flex; align-items: center; gap: 4px">
          <button type="button" class="btn step" aria-label="Меньше к броску" onClick="{{minus}}">−</button>
          <span class="well" style="width: 50px; height: 34px; display: grid; place-items: center; font-family: Forum, serif; font-size: 21px; color: #f1ece0">{{modVal}}</span>
          <button type="button" class="btn step" aria-label="Больше к броску" onClick="{{plus}}">+</button>
          <span style="margin-left: 6px; font-size: 11px; color: #8e897e">к броску</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 9px">
        <div class="head-h"><span class="gem"></span><span class="cap lbl">Удача · 4</span><div class="groove" style="flex-grow: 1"></div></div>
        <div style="display: flex; align-items: center; gap: 6px; height: 34px">
          <button type="button" class="{{luckZeroCls}}" aria-label="Не тратить Удачу" onClick="{{luckZero}}">—</button>
          <sc-for list="{{luck}}" as="l" hint-placeholder-count="4"><button type="button" class="{{l.cls}}" aria-label="{{l.label}}" onClick="{{l.pick}}"></button></sc-for>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px">
      <span class="cap lbl">Кому видно</span>
      <div class="well" style="display: inline-flex; gap: 2px; padding: 2px">
        <button type="button" class="sw on" aria-pressed="true">Всем</button><button type="button" class="sw" aria-pressed="false">Ведущему</button><button type="button" class="sw" aria-pressed="false">Втёмную</button><button type="button" class="sw" aria-pressed="false">Себе</button>
      </div>
    </div>
  </div>

  <footer class="rail" style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; border-top: 1px solid #060708; box-shadow: inset 0 1px 0 rgba(255,240,215,.07)">
    <div style="display: flex; flex-direction: column; gap: 3px">
      <span class="cap">Бросок</span>
      <span style="display: flex; align-items: baseline; gap: 7px"><span style="font-family: Forum, serif; font-size: 18px; color: #8e897e">d10 +</span><span class="metal" style="font-family: Forum, serif; font-size: 32px; line-height: 1">{{sum}}</span></span>
    </div>
    <div style="width: 0; align-self: stretch; border-left: 1px solid #050607; box-shadow: 1px 0 0 rgba(255,240,215,.06)"></div>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
      <span class="cap">Урон</span>
      <span style="font-family: Forum, serif; font-size: 25px; line-height: 1.1; color: {{dmgColor}}; white-space: nowrap">{{dmg}}</span>
      <span style="font-size: 10.5px; color: #8e897e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{dmgNote}}</span>
    </div>
    <button type="button" class="btn" style="height: 42px; padding: 0 14px; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase">Отмена</button>
    <button type="button" class="enamel" style="height: 42px; padding: 0 18px; font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase">Атаковать</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":960}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { type: 'strong', aim: 'torso', sit: { darkness: false, movingFast: false, ambush: false }, sitOpen: true, extra: false, mod: 0, luck: 0 }; }
  renderVals() {
    const s = this.state;
    const BASE = 17;
    const fmt = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
    const T = [
      { k: 'fast', label: 'Быстрая', mod: 0, mult: '×1', note: '0 · две за раунд', hint: 'Две атаки за раунд без штрафа — каждая отдельным броском.' },
      { k: 'strong', label: 'Сильная', mod: -3, mult: '×2', note: '−3 · урон ×2', hint: 'Одна атака, урон ×2.' },
      { k: 'charge', label: 'С разбега', mod: -3, mult: '×2', note: '−3 · полный раунд', hint: 'Бег и сильная атака. Заблокирована — встречная Сила, чтобы сбить с ног.' },
      { k: 'dual', label: 'Парное', mod: -3, mult: '×1', note: '−3 · две атаки', hint: 'Две атаки, каждая −3. Без парного оружия вторую нельзя блокировать.' },
      { k: 'pommel', label: 'Эфесом', mod: 0, mult: '×½', note: '0 · несмертельный', hint: 'Половина урона, несмертельный.' },
      { k: 'disarm', label: 'Разоружение', mod: 0, mult: '', note: '0 · без урона', hint: 'Оружие цели отлетает на 1d6 м в случайную сторону.' },
      { k: 'trip', label: 'Подсечка', mod: 0, mult: '', note: '0 · сбить с ног', hint: 'Цель сбита с ног.' },
      { k: 'feint', label: 'Финт', mod: 0, mult: '', note: 'Обман · +3 дальше', hint: 'Обман против Внимания: вторая атака в этом раунде с +3.' }
    ];
    const P = {
      head: { shell: 'M4.5 21.5V9L6.8 4.6L12 2.6L17.2 4.6L19.5 9V21.5H14.6L13.4 19.2H10.6L9.4 21.5Z', shell2: '', ink: 'M12 2.8V19', slit: 'M6.4 10.4H11.1V12.2H6.4ZM12.9 10.4H17.6V12.2H12.9Z', hi: 'M6.2 9.6V20.4' },
      torso: { shell: 'M3 7L6.5 3L10 4.6L12 6.2L14 4.6L17.5 3L21 7L18.8 10.2V16.2L16.6 21.5H7.4L5.2 16.2V10.2Z', shell2: '', ink: 'M12 6.4V21.3M5.3 15.6H18.7M3.3 7.2L6.4 9.4M20.7 7.2L17.6 9.4', slit: '', hi: 'M6 10.8V15' },
      arm: { shell: 'M5 2H15L16.4 8.6H4.6ZM4.6 8.6H16.4L17.2 14.2H5.2Z', shell2: 'M5.2 14.2H17.2L18.4 16.6L17.6 19.8L15.2 21.8H8.4L6 19.6Z', ink: 'M9.2 14.6V21.4M12.2 14.6V21.8M15 14.6V21.2M5.1 5.2H15.7', slit: 'M6.6 14.2L7.6 12.1L8.6 14.2ZM10.4 14.2L11.4 12.1L12.4 14.2ZM14.2 14.2L15.2 12.1L16.2 14.2Z', hi: 'M5.8 9.6V13.4' },
      leg: { shell: 'M7.2 1.6H13.4L14 11.4L13.2 16.4L19.4 18.4L21.4 21.8H7.6L6.6 16.4L6.2 11.4Z', shell2: 'M5.4 8L7 5.6H13.8L15.2 8L13.8 10.4H7Z', ink: 'M10.3 10.6V16.4M13.6 17L14.2 21.6M16 17.8L16.6 21.6M18.2 18.6L18.8 21.6M6.8 16.4H13.2', slit: '', hi: 'M7.4 11.6V15.8' },
      die: { shell: 'M12 1.5L22.5 10L12 22.5L1.5 10Z', shell2: '', ink: 'M1.5 10L12 14L22.5 10M12 14V22.5M12 1.5L7.4 11.6M12 1.5L16.6 11.6', slit: '', hi: 'M3.6 10.4L11 13.2' }
    };
    const L = [
      { k: 'random', label: 'Наугад', pen: 0, kind: 'die', note: 'часть тела — броском d10' },
      { k: 'head', label: 'Голова', pen: -6, kind: 'head', note: 'урон ×3' },
      { k: 'torso', label: 'Туловище', pen: -1, kind: 'torso', note: 'урон ×1' },
      { k: 'rarm', label: 'Пр. рука', pen: -3, kind: 'arm', note: 'урон ×½' },
      { k: 'larm', label: 'Лев. рука', pen: -3, kind: 'arm', flip: true, note: 'урон ×½' },
      { k: 'rleg', label: 'Пр. нога', pen: -2, kind: 'leg', note: 'урон ×½' },
      { k: 'lleg', label: 'Лев. нога', pen: -2, kind: 'leg', flip: true, note: 'урон ×½' }
    ];
    const SIT = [
      { k: 'immobilized', label: 'Цель обездвижена', v: 4 }, { k: 'ambush', label: 'Засада', v: 5 },
      { k: 'darkness', label: 'Темнота', v: -2 }, { k: 'movingFast', label: 'Цель быстрая, Реа > 10', v: -3 },
      { k: 'outOfVision', label: 'Вне конуса зрения', v: -3 }, { k: 'blinded', label: 'Ослеплён', v: -3 }
    ];
    const type = T.find(t => t.k === s.type);
    const aim = L.find(l => l.k === s.aim);
    const types = T.map(t => ({ label: t.label, note: t.note, cls: t.k === s.type ? 'opt on' : 'opt', pressed: t.k === s.type ? 'true' : 'false', pick: () => this.setState({ type: t.k }) }));
    const locs = L.map(l => {
      const on = l.k === s.aim; const g = P[l.kind];
      return { ...g, label: l.label, pen: l.pen ? fmt(l.pen) : '0', penCls: l.pen ? '' : 'zero', flip: l.flip ? 'translate(24 0) scale(-1 1)' : '',
        fill: on ? 'url(#m-ok)' : 'url(#m-dim)', cls: on ? 'loc on' : 'loc', pressed: on ? 'true' : 'false', pick: () => this.setState({ aim: l.k }) };
    });
    const sits = SIT.map(x => ({ label: x.label, val: fmt(x.v), valCls: x.v < 0 ? 'bad' : 'good', cls: s.sit[x.k] ? 'tog on' : 'tog', pressed: s.sit[x.k] ? 'true' : 'false',
      toggle: () => this.setState({ sit: { ...s.sit, [x.k]: !s.sit[x.k] } }) }));
    const sitSum = SIT.reduce((n, x) => n + (s.sit[x.k] ? x.v : 0), 0);
    const sum = BASE + type.mod + aim.pen + sitSum + (s.extra ? -3 : 0) + s.mod + s.luck;
    const luck = [1, 2, 3, 4].map(n => ({ cls: n <= s.luck ? 'coin on' : 'coin', label: 'Потратить Удачу: ' + n, pick: () => this.setState({ luck: n }) }));
    const noDamage = !type.mult;
    return {
      base: BASE, types, locs, sits, luck, sum,
      typeHint: type.hint, aimNote: aim.note,
      sitOpen: s.sitOpen, sitOpenAttr: s.sitOpen ? 'true' : 'false', sitChev: s.sitOpen ? 'none' : 'rotate(-90deg)',
      sitNote: sitSum ? fmt(sitSum) : 'не выбрано',
      toggleSit: () => this.setState({ sitOpen: !s.sitOpen }),
      extraCls: s.extra ? 'costplate on' : 'costplate', extraPressed: s.extra ? 'true' : 'false', toggleExtra: () => this.setState({ extra: !s.extra }),
      modVal: s.mod ? fmt(s.mod) : '0', minus: () => this.setState({ mod: s.mod - 1 }), plus: () => this.setState({ mod: s.mod + 1 }),
      luckZeroCls: s.luck === 0 ? 'coin zero on' : 'coin zero', luckZero: () => this.setState({ luck: 0 }),
      dmg: noDamage ? 'без урона' : '3d6 ' + (type.mult === '×1' ? '' : type.mult),
      dmgColor: noDamage ? '#8e897e' : '#f1ece0',
      dmgNote: noDamage ? type.note.replace(/^0 · /, '') : 'серебро против чудовища · ' + aim.note
    };
  }
}
</script>
