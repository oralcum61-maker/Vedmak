<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
  <style>

    a { color: #b4914e; text-decoration: none; } a:hover { color: #e3c078; }

    .tex-leather { background-image: url("/_blob/7445afe0e95c33efb75f14da6a59f8f5"); background-size: 420px; background-blend-mode: overlay; }
    .tex-bronze { background-image: url("/_blob/cbb282ee0d6d0a63c21172ffa0c7c378"); background-size: 220px; background-blend-mode: overlay; }

<div class="tex-leather" style="width: 300px; height: 880px; box-sizing: border-box; display: flex; flex-direction: column; gap: 13px; padding: 14px 14px 12px; background-color: #221b13; border: 1px solid #0d0a07; box-shadow: inset -6px 0 10px rgba(0,0,0,.3);">

  <div style="position: relative; height: 200px; background-color: #14100b; border: 1px solid #0f0b07; box-shadow: inset 0 0 0 1px rgba(180,145,78,.22);">
    <div style="position: absolute; inset: 0; display: grid; place-items: center; color: #3b3225;">
      <svg width="92" height="92" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true">
        <path d="M12 3c-3.2 0-5 2.2-5 5 0 2 .6 3.1 1.2 4.1.5.9.8 1.5.8 2.4 0 1.3-.7 2-2 2.6C5.3 18 4 19.3 4 21h16c0-1.7-1.3-3-3-3.9-1.3-.6-2-1.3-2-2.6 0-.9.3-1.5.8-2.4C16.4 11.1 17 10 17 8c0-2.8-1.8-5-5-5z"/>

    <span style="position: absolute; right: 6px; bottom: 6px; width: 11px; height: 11px; border-right: 1px solid #b4914e; border-bottom: 1px solid #b4914e;"></span>
    <button type="button" aria-label="Сменить портрет" style="position: absolute; right: 8px; top: 8px; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; background: rgba(20,16,11,.7); color: #97886c; border: 1px solid #443a2b; cursor: pointer;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 18V7h4l2-2h6l2 2h4v11z"/><circle cx="12" cy="12.5" r="3.3"/></svg>

    </div>

  <div style="display: flex; flex-wrap: wrap; gap: 4px;">

  </div>

  <div style="display: flex; flex-direction: column; gap: 11px;">

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-family: Forum, serif; font-size: 11px; letter-spacing: .16em; color: #97886c;">ПЗ</span>
        <span style="flex-grow: 1;"></span>
        <input type="text" value="5" aria-label="Здоровье"
               style="width: 38px; padding: 0; text-align: right; font-family: Forum, serif; font-size: 22px; line-height: 1; color: #c0533f; background: transparent; border: none;">
        <span style="font-size: 11.5px; color: #6b5c42;">/ 20</span>
      </div>
      <div style="position: relative; height: 12px; background: #120e09; border: 1px solid #0f0b07;">
        <span style="position: absolute; inset: 1px; width: 25%; background: linear-gradient(180deg, #a8352a, #6e2219);"></span>

    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: baseline; gap: 6px;">

        <input type="text" value="18" aria-label="Выносливость"

        <span style="font-size: 11.5px; color: #6b5c42;">/ 30</span>
      </div>
      <div style="position: relative; height: 12px; background: #120e09; border: 1px solid #0f0b07;">
        <span style="position: absolute; inset: 1px; width: 60%; background: linear-gradient(180deg, #8a9450, #5c6533);"></span>
        <span style="position: absolute; left: 25%; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,.45);"></span>
        <span style="position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,.45);"></span>
        <span style="position: absolute; left: 75%; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,.45);"></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-family: Forum, serif; font-size: 11px; letter-spacing: .16em; color: #97886c;">ТОКСИЧНОСТЬ</span>
        <span style="flex-grow: 1;"></span>
        <input type="text" value="45" aria-label="Токсичность"
               style="width: 38px; padding: 0; text-align: right; font-family: Forum, serif; font-size: 22px; line-height: 1; color: #e8dcc2; background: transparent; border: none;">
        <span style="font-size: 11.5px; color: #6b5c42;">/ 100</span>
      </div>
      <div style="position: relative; height: 12px; background: #120e09; border: 1px solid #0f0b07;">
        <span style="position: absolute; inset: 1px; width: 45%; background: linear-gradient(180deg, #7b6ba8, #4a3d70);"></span>
        <span style="position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: #6b5c42;" title="Половина — дурнота"></span>
      </div>
      <span style="font-size: 10.5px; color: #6b5c42;">Засечка на половине — выше неё дурнота</span>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 1px;">

      <input type="text" value="30" aria-label="Очки улучшения"
             style="width: 32px; padding: 0; text-align: right; font-family: Forum, serif; font-size: 16px; color: #ded3bb; background: transparent; border: none;">

      <span style="font-size: 10px; letter-spacing: .06em; color: #97886c;">Энергия</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 2px 7px; border-right: 1px solid #191309;">
      <span style="font-family: Forum, serif; font-size: 23px; line-height: 1; color: #e8dcc2;">6</span>
      <span style="font-size: 10px; letter-spacing: .06em; color: #97886c;">Уст</span>

      <span style="font-family: Forum, serif; font-size: 23px; line-height: 1; color: #e8dcc2;">12<small style="font-size: 11px; color: #97886c;">м</small></span>
      <span style="font-size: 10px; letter-spacing: .06em; color: #97886c;">Бег</span>
    </div>
  </div>

  <span style="flex-grow: 1;"></span>

  <div style="display: flex; gap: 7px;">
    <button type="button" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0; background: linear-gradient(180deg, #4a3a1e, #2c2111); color: #f0dba6; border: 1px solid #b4914e; border-radius: 2px; cursor: pointer; font-family: Forum, serif; font-size: 14px; letter-spacing: .04em; box-shadow: inset 0 1px 0 rgba(255,235,200,.18);">
